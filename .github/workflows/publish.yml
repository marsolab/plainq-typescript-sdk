name: Publish npm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - name: Require matching version tag
        run: test "$GITHUB_REF" = "refs/tags/v$(node -p "require('./package.json').version")"
      - run: npm publish --access public --provenance
